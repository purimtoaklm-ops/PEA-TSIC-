<title>Search of PEA (TSIC)</title>
<style>
  /* ── Design tokens ── */
  :root {
    --pea-purple:   #6B1E7A;
    --pea-purple2:  #8B2FA0;
    --pea-gold:     #C8972B;
    --bg:           #F7F4FA;
    --surface:      #FFFFFF;
    --border:       #E0D5E8;
    --text-main:    #1A0A22;
    --text-sub:     #5A4A66;
    --text-light:   #8A7A96;
    --highlight-bg: #FFE680;
    --highlight-text:#1A0A22;
    --radius:       12px;
    --radius-sm:    8px;
    --shadow:       0 2px 12px rgba(107,30,122,0.08);
    --shadow-hover: 0 6px 24px rgba(107,30,122,0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, var(--pea-purple) 0%, var(--pea-purple2) 100%);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 96px;
    box-shadow: 0 2px 16px rgba(107,30,122,0.25);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left h1 {
    color: #fff;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .header-left p {
    color: rgba(255,255,255,0.75);
    font-size: 0.78rem;
    margin-top: 2px;
  }

  .header-logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
  }

  /* ── Main ── */
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 36px 20px 60px;
  }

  /* ── Search box ── */
  .search-wrap {
    position: relative;
    margin-bottom: 12px;
  }

  .search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--pea-purple);
    font-size: 1.1rem;
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    padding: 16px 20px 16px 50px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    font-size: 1.05rem;
    font-family: inherit;
    background: var(--surface);
    color: var(--text-main);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #searchInput:focus {
    border-color: var(--pea-purple);
    box-shadow: 0 0 0 3px rgba(107,30,122,0.12);
  }

  #searchInput::placeholder { color: var(--text-light); }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    min-height: 24px;
  }

  .result-count {
    font-size: 0.85rem;
    color: var(--text-sub);
  }

  .result-count span {
    font-weight: 700;
    color: var(--pea-purple);
  }

  /* ── Recent searches ── */
  .recent-wrap {
    margin-bottom: 20px;
  }

  .recent-label {
    font-size: 0.78rem;
    color: var(--text-light);
    margin-bottom: 8px;
  }

  .recent-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .recent-tag {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.82rem;
    color: var(--pea-purple);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .recent-tag:hover {
    background: var(--pea-purple);
    color: #fff;
    border-color: var(--pea-purple);
  }

  /* ── Filter chips ── */
  .filter-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .chip {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.82rem;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }

  .chip:hover, .chip.active {
    background: var(--pea-purple);
    border-color: var(--pea-purple);
    color: #fff;
  }

  /* ── Result cards ── */
  .results {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s, border-color 0.2s;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--pea-purple);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
  }

  .card-code {
    background: var(--pea-purple);
    color: #fff;
    font-size: 0.88rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 6px;
    white-space: nowrap;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  .card-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-main);
    flex: 1;
    line-height: 1.4;
  }

  .card-toggle {
    color: var(--text-light);
    font-size: 0.9rem;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .card.open .card-toggle { transform: rotate(180deg); }

  .card-body {
    display: none;
    padding: 0 18px 16px 18px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }

  .card.open .card-body { display: block; }

  .card-desc {
    font-size: 0.92rem;
    color: var(--text-sub);
    line-height: 1.7;
  }

  /* ── Highlight ── */
  mark {
    background: var(--highlight-bg);
    color: var(--highlight-text);
    border-radius: 3px;
    padding: 0 2px;
    font-weight: 600;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }

  .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .empty p { font-size: 0.95rem; }

  /* ── Welcome state ── */
  .welcome {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-sub);
  }

  .welcome-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--pea-purple);
    margin-bottom: 8px;
  }

  .welcome-sub { font-size: 0.92rem; line-height: 1.6; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    header { padding: 0 16px; height: 64px; }
    .header-left h1 { font-size: 1rem; }
    main { padding: 24px 12px 40px; }
    #searchInput { font-size: 0.95rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
</head>

// ── State ──
let query = '';
let activeCat = 'all';
let recentSearches = JSON.parse(localStorage.getItem('pea_recent') || '[]');

// ── Elements ──
const input = document.getElementById('searchInput');
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('resultCount');
const recentWrap = document.getElementById('recentWrap');
const recentTagsEl = document.getElementById('recentTags');

// ── Highlight helper ──
function highlight(text, q) {
  if (!q) return text;
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

// ── Filter by category ──
function matchCat(item) {
  if (activeCat === 'all') return true;
  return item.code.startsWith(activeCat);
}

// ── Search ──
function search() {
  query = input.value.trim();
  const q = query.toLowerCase();

  let filtered = DATA.filter(item => {
    if (!matchCat(item)) return false;
    if (!q) return true;
    return (
      item.code.includes(q) ||
      item.name.toLowerCase().includes(q) ||
      item.description.toLowerCase().includes(q)
    );
  });

  renderResults(filtered, q);
}

// ── Render ──
function renderResults(items, q) {
  if (!q && activeCat === 'all') {
    resultsEl.innerHTML = `
      <div class="welcome">
        <div class="welcome-title">ค้นหารหัส TSIC</div>
        <div class="welcome-sub">พิมพ์ชื่อกิจการหรือรหัส TSIC ในช่องด้านบน<br>เพื่อค้นหาประเภทมาตรฐานอุตสาหกรรมไทย</div>
      </div>`;
    countEl.innerHTML = '';
    return;
  }

  if (items.length === 0) {
    resultsEl.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <p>ไม่พบรายการที่ตรงกับ "<strong>${q}</strong>"<br>ลองใช้คำอื่นหรือค้นด้วยรหัสตัวเลข</p>
      </div>`;
    countEl.innerHTML = `พบ <span>0</span> รายการ`;
    return;
  }

  countEl.innerHTML = `พบ <span>${items.length}</span> รายการ`;

  resultsEl.innerHTML = items.map(item => `
    <div class="card" data-code="${item.code}">
      <div class="card-header" onclick="toggleCard(this)">
        <span class="card-code">${highlight(item.code, q)}</span>
        <span class="card-name">${highlight(item.name, q)}</span>
        <span class="card-toggle">▼</span>
      </div>
      <div class="card-body">
        <div class="card-desc">${highlight(item.description, q)}</div>
      </div>
    </div>
  `).join('');
}

// ── Toggle card ──
function toggleCard(header) {
  const card = header.closest('.card');
  card.classList.toggle('open');
}

// ── Recent searches ──
function saveRecent(q) {
  if (!q || q.length < 2) return;
  recentSearches = [q, ...recentSearches.filter(r => r !== q)].slice(0, 6);
  localStorage.setItem('pea_recent', JSON.stringify(recentSearches));
  renderRecent();
}

function renderRecent() {
  if (recentSearches.length === 0) {
    recentWrap.style.display = 'none';
    return;
  }
  recentWrap.style.display = 'block';
  recentTagsEl.innerHTML = recentSearches.map(r =>
    `<button class="recent-tag" onclick="useRecent('${r.replace(/'/g, "\\'")}')">${r}</button>`
  ).join('');
}

function useRecent(q) {
  input.value = q;
  search();
  input.focus();
}

// ── Category filter ──
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeCat = chip.dataset.cat;
    search();
  });
});

// ── Input events ──
let debounce;
input.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    search();
  }, 200);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && query.length >= 2) {
    saveRecent(query);
  }
});

// ── Init ──
renderRecent();
</script>
